
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Church Attendance Manager</title>

<style>
:root {
  --primary: #176b45;
  --primary-dark: #105436;
  --background: #f4f7f5;
  --surface: #ffffff;
  --text: #172b22;
  --muted: #75847c;
  --border: #e5ebe7;
  --success-bg: #e5f5eb;
  --success: #16834c;
  --gray-bg: #eef0f2;
  --gray: #737d85;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background: var(--background);
  color: var(--text);
}

.header {
  background: linear-gradient(120deg, #103d2b, #176b45);
  color: white;
  padding: 28px 20px 85px;
}

.header-inner {
  max-width: 1050px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  height: 48px;
  width: 48px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.15);
  border-radius: 15px;
  font-size: 24px;
}

.brand h1 {
  font-size: 20px;
  margin: 0;
}

.brand p {
  margin: 5px 0 0;
  color: #c8e5d5;
  font-size: 12px;
}

.online {
  font-size: 12px;
  background: rgba(255,255,255,.14);
  padding: 9px 13px;
  border-radius: 30px;
}

.container {
  max-width: 900px;
  margin: -58px auto 50px;
  padding: 0 18px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(20,50,35,.045);
}

.dashboard {
  padding: 25px;
}

.section-label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.date-select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
  background: #fbfcfb;
  color: var(--text);
  font-size: 15px;
  outline: none;
  cursor: pointer;
}

.date-select:focus,
.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(23,107,69,.08);
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.stat {
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 19px;
}

.stat small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.stat strong {
  display: block;
  margin-top: 8px;
  font-size: 29px;
}

.stat.present strong {
  color: var(--success);
}

.search-card {
  margin-top: 22px;
  padding: 32px;
}

.search-title {
  text-align: center;
  margin-bottom: 25px;
}

.search-title h2 {
  font-size: 23px;
  margin: 0 0 8px;
}

.search-title p {
  color: var(--muted);
  font-size: 13px;
  margin: 0;
}

.search-wrapper {
  position: relative;
  max-width: 620px;
  margin: auto;
}

.search-box {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0 17px;
  background: #fbfcfb;
  transition: .2s;
}

.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(23,107,69,.07);
}

.search-icon {
  font-size: 19px;
  color: var(--muted);
}

.search-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  padding: 17px 12px;
  font-size: 14px;
  color: var(--text);
}

.search-input:focus {
  box-shadow: none;
}

.search-input::placeholder {
  color: #a0aaa4;
}

.results-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 27px 0 13px;
}

.results-heading strong {
  font-size: 13px;
}

.results-heading span {
  font-size: 12px;
  color: var(--muted);
}

.results {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.member {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 14px;
  transition: .2s;
}

.member:hover {
  border-color: #b7d8c5;
  background: #fcfefc;
}

.member-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.avatar {
  height: 42px;
  width: 42px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: #e8f3ec;
  color: var(--primary);
  font-weight: 700;
  border-radius: 13px;
  font-size: 14px;
}

.member-name {
  font-weight: 650;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.member-phone {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}

.status {
  border: none;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  min-width: 125px;
  transition: .2s;
}

.status.absent {
  background: var(--gray-bg);
  color: var(--gray);
}

.status.present {
  background: var(--success-bg);
  color: var(--success);
}

.status:disabled {
  opacity: .65;
  cursor: wait;
}

.empty {
  text-align: center;
  padding: 35px 15px;
  color: var(--muted);
  font-size: 13px;
}

.footer {
  text-align: center;
  padding: 25px 10px;
  font-size: 12px;
  color: var(--muted);
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translate(-50%, 100px);
  opacity: 0;
  background: #173d2c;
  color: white;
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,.15);
  transition: .3s;
  z-index: 10;
  max-width: calc(100% - 30px);
}

.toast.show {
  transform: translate(-50%, 0);
  opacity: 1;
}

.loading {
  text-align: center;
  padding: 25px;
  color: var(--muted);
  font-size: 13px;
}

@media(max-width:600px) {
  .header {
    padding: 22px 16px 78px;
  }

  .brand h1 {
    font-size: 16px;
  }

  .brand p {
    font-size: 11px;
  }

  .logo {
    width: 42px;
    height: 42px;
  }

  .container {
    padding: 0 12px;
  }

  .dashboard {
    padding: 19px;
  }

  .search-card {
    padding: 23px 15px;
  }

  .search-title h2 {
    font-size: 20px;
  }

  .member {
    padding: 12px 10px;
  }

  .status {
    min-width: 105px;
    padding: 11px 8px;
    font-size: 11px;
  }

  .avatar {
    width: 36px;
    height: 36px;
  }

  .member-name {
    font-size: 12px;
  }

  .member-phone {
    font-size: 11px;
  }

  .stat strong {
    font-size: 24px;
  }

  .online {
    font-size: 10px;
    padding: 8px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">✝</div>
      <div>
        <h1>Church Attendance</h1>
        <p>Member attendance management</p>
      </div>
    </div>

    <div class="online">● Online</div>
  </div>
</header>

<main class="container">

  <section class="card dashboard">

    <label class="section-label" for="dateSelect">
      SELECT SUNDAY
    </label>

    <select id="dateSelect" class="date-select"></select>

    <div class="stats">

      <div class="stat">
        <small>Total Members</small>
        <strong id="totalMembers">0</strong>
      </div>

      <div class="stat present">
        <small>Present Today</small>
        <strong id="presentCount">0</strong>
      </div>

    </div>
  </section>

  <section class="card search-card">

    <div class="search-title">
      <h2>Find a Member</h2>
      <p>Search for a member and update their attendance.</p>
    </div>

    <div class="search-wrapper">

      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search by name or phone number..."
          autocomplete="off"
        />
      </div>

    </div>

    <div class="results-heading">
      <strong>Members</strong>
      <span id="resultCount">0 members</span>
    </div>

    <div id="results" class="results">
      <div class="loading">Loading members...</div>
    </div>

  </section>

  <div class="footer">
    Church Attendance Management System
    <br><br>
    Attendance changes are saved online.
  </div>

</main>

<div id="toast" class="toast"></div>

<script>

// ========================================
// 1. INSERT YOUR GOOGLE APPS SCRIPT URL
// ========================================

const API_URL = "https://script.google.com/macros/s/AKfycbx9ACYt8JushPDx65bE6Se8RcDxMofNX8Qqv1sTu2J8EvWW37HwXaJMsjEpo01-lLhPZQ/exec";

// ========================================
// 2. SUNDAY DATES
// ========================================

const SUNDAYS = [
  "2026-10-04",
  "2026-10-11",
  "2026-10-18",
  "2026-10-25",
  "2026-11-01",
  "2026-11-08",
  "2026-11-15",
  "2026-11-22",
  "2026-11-29",
  "2026-12-06",
  "2026-12-13",
  "2026-12-20",
  "2026-12-27"
];

let members = [];
let attendance = {};
let selectedDate = SUNDAYS[0];
let toastTimer;

// ========================================
// 3. ELEMENTS
// ========================================

const dateSelect = document.getElementById("dateSelect");
const searchInput = document.getElementById("searchInput");
const results = document.getElementById("results");
const totalMembers = document.getElementById("totalMembers");
const presentCount = document.getElementById("presentCount");
const resultCount = document.getElementById("resultCount");

// ========================================
// 4. HELPERS
// ========================================

function formatDate(dateString) {
  const date = new Date(dateString + "T12:00:00");

  return date.toLocaleDateString("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function showToast(message) {
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

function initials(name) {
  return name
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(word => word[0].toUpperCase())
    .join("");
}

// ========================================
// 5. CREATE DATE OPTIONS
// ========================================

function initializeDates() {
  dateSelect.innerHTML = SUNDAYS.map(date => `
    <option value="${date}">
      ${formatDate(date)}
    </option>
  `).join("");

  dateSelect.value = selectedDate;
}

// ========================================
// 6. LOAD MEMBERS
// ========================================

async function loadMembers() {
  try {
    const response = await fetch(
      API_URL + "?action=getMembers"
    );

    if (!response.ok) {
      throw new Error("Could not connect to server");
    }

    members = await response.json();

    totalMembers.textContent = members.length;

    await loadAttendance();

  } catch (error) {
    console.error(error);

    results.innerHTML = `
      <div class="empty">
        Unable to load members.
        Please check your API URL and deployment.
      </div>
    `;

    showToast("Unable to connect to attendance database.");
  }
}

// ========================================
// 7. LOAD ATTENDANCE FOR SELECTED SUNDAY
// ========================================

async function loadAttendance() {
  results.innerHTML = `
    <div class="loading">Loading attendance...</div>
  `;

  try {
    const response = await fetch(
      API_URL +
      "?action=getAttendance&date=" +
      encodeURIComponent(selectedDate)
    );

    if (!response.ok) {
      throw new Error("Unable to load attendance");
    }

    const data = await response.json();

    attendance = {};

    data.forEach(member => {
      attendance[member.name.toLowerCase()] =
        member.present;
    });

    updateDashboard();
    renderMembers();

  } catch (error) {
    console.error(error);

    results.innerHTML = `
      <div class="empty">
        Could not retrieve attendance for this Sunday.
      </div>
    `;

    showToast("Attendance loading failed.");
  }
}

// ========================================
// 8. UPDATE SUMMARY
// ========================================

function updateDashboard() {
  const count = Object.values(attendance)
    .filter(Boolean).length;

  presentCount.textContent = count;
  totalMembers.textContent = members.length;
}

// ========================================
// 9. SEARCH MEMBERS
// ========================================

function renderMembers() {
  const query = searchInput.value
    .trim()
    .toLowerCase();

  const filtered = members.filter(member =>
    member.name.toLowerCase().includes(query) ||
    member.phone.toLowerCase().includes(query)
  );

  resultCount.textContent =
    `${filtered.length} member${filtered.length === 1 ? "" : "s"}`;

  if (filtered.length === 0) {
    results.innerHTML = `
      <div class="empty">
        No matching members found.
      </div>
    `;

    return;
  }

  results.innerHTML = filtered.map(member => {
    const isPresent =
      Boolean(attendance[member.name.toLowerCase()]);

    return `
      <div class="member">

        <div class="member-info">

          <div class="avatar">
            ${escapeHTML(initials(member.name))}
          </div>

          <div>
            <div class="member-name">
              ${escapeHTML(member.name)}
            </div>

            <div class="member-phone">
              ${escapeHTML(member.phone || "No phone number")}
            </div>
          </div>

        </div>

        <button
          class="status ${isPresent ? "present" : "absent"}"
          data-name="${escapeHTML(member.name)}"
          data-present="${isPresent}"
        >
          ${isPresent ? "✓ In Church" : "Not in Church"}
        </button>

      </div>
    `;
  }).join("");
}

// ========================================
// 10. UPDATE ATTENDANCE
// ========================================

async function toggleAttendance(name, button) {
  const key = name.toLowerCase();

  const previousStatus = Boolean(attendance[key]);

  const newStatus = !previousStatus;

  button.disabled = true;
  button.textContent = "Saving...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "updateAttendance",
        name: name,
        date: selectedDate,
        present: newStatus
      })
    });

    const result = await response.json();

    if (!result.success) {
      throw new Error(result.message || "Update failed");
    }

    attendance[key] = newStatus;

    updateDashboard();
    renderMembers();

    showToast(
      newStatus
        ? name + " marked In Church"
        : name + " marked Not in Church"
    );

  } catch (error) {
    console.error(error);

    showToast("Could not save. Please try again.");

    button.disabled = false;
    button.textContent = previousStatus
      ? "✓ In Church"
      : "Not in Church";
  }
}

// ========================================
// 11. EVENTS
// ========================================

searchInput.addEventListener("input", renderMembers);

dateSelect.addEventListener("change", async () => {
  selectedDate = dateSelect.value;
  await loadAttendance();
});

results.addEventListener("click", event => {
  const button = event.target.closest(".status");

  if (!button || button.disabled) return;

  toggleAttendance(button.dataset.name, button);
});

// ========================================
// 12. INITIALIZE
// ========================================

initializeDates();
loadMembers();

</script>

</body>
</html>
